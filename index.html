    @keyframes fadeIn {

<body>
  <div class="confetti-container" id="confetti-container"></div>

  <div class="bg">
    <div class="question">Är det dags att köpa något annat än index?</div>
    <div class="nej-text" id="nej-text" title="Klicka för konfetti!">NEJ!</div>
    <div class="explanation" id="random-text"></div>
    <div class="hint">👆 Klicka på svaret för en överraskning!</div>
    <div class="counter" id="counter"></div>
  </div>

  <!-- Footer Section -->
  <footer>
    <p>A Bracket Racket production – <a href="https://bracket-racket.se" target="_blank" rel="noopener noreferrer">bracket-racket.se</a></p>
  </footer>

  <script>
    var nejAlternativ = [
      "Strategin uppvisar inte optimal allokeringsrationell effektivitet.",
      "Detta tillvägagångssätt i kapitalallokering är suboptimalt ur ett risk-avkastningsperspektiv.",
      "Investeringsstrategin manifesterar en brist på due diligence och portföljdiversifiering.",
      "Strategin är inte i linje med bästa praxis inom kapitalförvaltning och riskhantering.",
      "Detta investeringsbeslut karakteriseras av en avsaknad av djuplodande finansiell analys.",
      "Investeringsstrategin uppvisar inte den strukturella robusthet som krävs för långsiktig avkastning.",
      "Strategin reflekterar inte en holistisk syn på marknadens dynamik och risktollerans.",
      "Investeringsplanen bär på signifikanta begränsningar i dess förmåga att generera hållbar avkastning.",
      "Strategin avviker från industristandarder gällande diversifiering och riskmitigering.",
      "Investeringsstrategin uppvisar en brist på synergi med övergripande finansiella målsättningar.",
      "Aktiv förvaltning tenderar att underperforma indexfonder efter avgifter.",
      "Historisk data stödjer konsekvent passiv indexering över aktiv stockpicking.",
      "Marknadseffektivitet gör det extremt svårt att systematiskt överträffa index.",
      "Diversifieringsfördelarna med breda indexfonder är svårslagna.",
      "Avgiftsarbitrage favoriserar låg-kostnadsindexfonder på lång sikt.",
      "Beteendeekonomisk forskning visar att timing av marknaden sällan lyckas.",
      "Compound interest fungerar bäst med låga avgifter och bred exponering.",
      "De flesta professionella förvaltare misslyckas med att slå index över tid.",
      "KISS-principen (Keep It Simple, Stupid) gäller även för investeringar.",
      "Warren Buffett rekommenderar indexfonder för de flesta investerare."
    ];

    var slumpatNej = nejAlternativ[Math.floor(Math.random() * nejAlternativ.length)];
    var randomTextElement = document.getElementById("random-text");
    randomTextElement.textContent = slumpatNej;

    // Click counter
    var clickCount = 0;
    var counterElement = document.getElementById("counter");

    function updateCounter() {
      if (clickCount === 1) {
        counterElement.textContent = "Du har bekräftat detta " + clickCount + " gång! 🎉";
      } else if (clickCount > 1) {
        counterElement.textContent = "Du har bekräftat detta " + clickCount + " gånger! 🎉";
      }
    }

    // Confetti effect
    function createConfetti() {
      var container = document.getElementById("confetti-container");
      var colors = ["#0d6efd", "#198754", "#ffc107", "#dc3545", "#6f42c1", "#20c997"];
      var shapes = ["■", "●", "▲", "★"];

      for (var i = 0; i < 50; i++) {
        var confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.top = "-20px";
        confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.fontSize = (Math.random() * 15 + 10) + "px";
        confetti.style.animation = "confettiFall " + (Math.random() * 2 + 1.5) + "s linear forwards";
        confetti.style.animationDelay = (Math.random() * 0.5) + "s";
        container.appendChild(confetti);

        // Remove confetti after animation
        setTimeout(function() {
          confetti.remove();
        }, 4000);
      }
    }

    // Click handler
    var nejText = document.getElementById("nej-text");
    nejText.addEventListener("click", function() {
      clickCount++;
      updateCounter();
      createConfetti();

      // Change the explanation text on click
      var currentIndex = nejAlternativ.indexOf(randomTextElement.textContent);
      var newIndex = Math.floor(Math.random() * (nejAlternativ.length - 1));
      if (newIndex >= currentIndex && currentIndex !== -1) {
        newIndex++;
      }
      randomTextElement.textContent = nejAlternativ[newIndex];
    });
  </script>
